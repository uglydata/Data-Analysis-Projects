name: Python tests

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  real-wages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Real-wage calculation unit tests (offline)
        working-directory: 06-Latvia-Real-Wages
        run: python test_real_wages.py
